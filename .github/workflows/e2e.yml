name: E2E Chain Validation

# On-demand + nightly ONLY — never pull_request, never push. This suite makes
# a real deploy to Paseo Next v2 (a DotNS write, an IPFS pin, and a gateway
# roundtrip against a public testnet), and testnet weather is outside this
# repo's control. Gating merges on it would make "cannot merge" indistinguishable
# from "testnet is down" — `Unit Tests` (.github/workflows/tests.yml) stays the
# only required check on main; this workflow is purely an on-demand/nightly
# button. See the design doc's "Trigger" section:
# docs-internal/superpowers/specs/2026-08-10-e2e-chain-validation-design.md
on:
  workflow_dispatch:
    inputs:
      channel:
        description: >-
          bulletin-deploy channel. 'latest' (the nightly default) installs
          bulletin-deploy@latest on top of the package.json pin, to catch
          upstream ABI drift the night it lands (see BULLETIN_DEPLOY_CHANNEL
          below). Dispatch 'pinned' to run against exactly what package.json
          pins instead — comparing the two tells an upstream bulletin-deploy
          regression (only 'latest' fails) apart from chain drift (both fail)
          or our own staleness (only 'pinned' fails). See e2e/BOOTSTRAP.md
          item 5.
        type: choice
        options:
          - latest
          - pinned
        default: latest
  schedule:
    # 03:17 UTC — deliberately off-the-hour, so this doesn't stack onto
    # GitHub's scheduler at the same instant as every other repo's midnight
    # or top-of-hour cron.
    - cron: "17 3 * * *"

# The suite re-deploys over ONE fixed DotNS name every run, `decentralize-ci.dot`
# (see the design doc's "Name strategy" and e2e/BOOTSTRAP.md item 1) — bounded
# on-chain state, but it means two overlapping runs would race writing over the
# same name mid-deploy. cancel-in-progress: false queues a second run instead
# of cancelling the first mid-chain-write, which could leave the name in an
# unknown state (partial upload, registration but no content, etc.).
concurrency:
  group: e2e-chain-validation
  cancel-in-progress: false

# No secrets, ever: the suite runs as bulletin-deploy's pool-fallback signer,
# which needs neither a login session nor a --mnemonic (see e2e/BOOTSTRAP.md
# items 4 and 6). Least privilege regardless — this workflow has no reason to
# write anything.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E Chain Validation
    runs-on: ubuntu-latest
    # package.json keeps an EXACT bulletin-deploy pin so end users get a
    # known-good, reproducible version — that pin is never changed here.
    # This job instead tracks the LATEST published bulletin-deploy on top of
    # it (see the install step below), so upstream ABI drift is caught the
    # night it lands rather than whenever someone next gets around to
    # bumping the pin (this is exactly how decentralize missed the
    # paseo-next-v2 POP_RULES pricing-ABI change every night since
    # 2026-09-02 — see e2e/BOOTSTRAP.md item 5). A red run under this job
    # therefore has THREE possible causes, not one: an upstream
    # bulletin-deploy regression, chain drift (the testnet's own contracts
    # changed), or this repo's own staleness. The version banner every vitest
    # run prints (e2e/bulletin-version.ts) plus the channel input above are
    # what separate them — a 'latest'-only failure is an upstream regression,
    # a 'pinned'-only failure is our staleness, and both failing together is
    # chain drift.
    #
    # inputs.channel only exists on a workflow_dispatch trigger; the schedule
    # trigger has no inputs at all, and scheduled (nightly) runs must always
    # default to 'latest' — the whole point of this job.
    env:
      BULLETIN_DEPLOY_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install latest bulletin-deploy (channel: latest only)"
        if: env.BULLETIN_DEPLOY_CHANNEL == 'latest'
        # --no-save is deliberate: this must never touch package.json or
        # package-lock.json (those stay pinned at the release this repo has
        # verified — see e2e/BOOTSTRAP.md item 5's re-verification checklist).
        # It only swaps what's on disk in node_modules for THIS job.
        run: npm install --no-save bulletin-deploy@latest
      - name: Report resolved bulletin-deploy version
        # Never trust the install step silently: if it no-ops (latest already
        # equals the pin, or a registry hiccup left the old copy in place),
        # this must still show the TRUE installed version, read straight off
        # disk. This runs on EVERY channel (not just 'latest') so a 'pinned'
        # dispatch also gets its version recorded, for the same
        # regression/drift/staleness comparison described above. Surfaced
        # into the step summary too, so a nightly reader sees it without
        # opening logs.
        run: |
          INSTALLED=$(node -e "process.stdout.write(require('./node_modules/bulletin-deploy/package.json').version)")
          PINNED=$(node -e "process.stdout.write(require('./package.json').dependencies['bulletin-deploy'])")
          echo "Resolved bulletin-deploy: ${INSTALLED} (channel: ${BULLETIN_DEPLOY_CHANNEL}; package.json pins ${PINNED})"
          {
            echo "### bulletin-deploy version"
            echo "- installed: \`${INSTALLED}\`"
            echo "- channel: \`${BULLETIN_DEPLOY_CHANNEL}\`"
            echo "- package.json pin: \`${PINNED}\`"
          } >>"$GITHUB_STEP_SUMMARY"
      # The suite drives dist/cli.js directly, matching what users install —
      # not the TypeScript source. See e2e/deploy.e2e.test.ts's module doc.
      - run: npm run build
      - name: Install Kubo (ipfs)
        # Pinned to a known-good version rather than "latest", for the same
        # reason this repo pins bulletin-deploy: reproducibility over
        # whatever happens to be current on the day a run executes.
        run: |
          curl -sSL https://dist.ipfs.tech/kubo/v0.40.1/kubo_v0.40.1_linux-amd64.tar.gz -o kubo.tar.gz
          tar -xzf kubo.tar.gz
          sudo bash kubo/install.sh
          ipfs version
      # decentralize's own preflight only checks that `ipfs` resolves on
      # PATH — the repo is bulletin-deploy's requirement, one layer down. A
      # fresh runner has the binary but no repo, and the design's first spike
      # died right here with "no IPFS repo found in <HOME>/.ipfs. please run:
      # 'ipfs init'". See the design doc's "CI needs `ipfs init`, not just an
      # `ipfs` binary" section and e2e/BOOTSTRAP.md item 2.
      - run: ipfs init
      # Preflight gate: fail loudly, before spending a real deploy, if any
      # dependency this suite leans on (Kubo, the bulletin-deploy pin, the
      # gateway, the manifest exports) is missing or has drifted. Read-only —
      # never touches the chain. See e2e/BOOTSTRAP.md.
      - run: e2e/bootstrap.sh
      - run: npm run test:e2e
